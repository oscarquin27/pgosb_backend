  enable_ssl: true
  ssl_cert: "./config/pruebas.gres.net.pem"
  ssl_key: "./config/pruebas.gres.net-key.pem"
  allow_origins:
    - "https://gres.local.net:8083"
    - "http://gres.local.net:8084"
